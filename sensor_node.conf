#request of sensor state by executing lambda-commands. send_state is set to the request-packet. After that update_sensor is activated which sends the command via CAN and gets inactive again
#Query of the sensor status by executing the lambda command. send_state is set to the request packet. Then Update_sensor is activated, which sends the command via CAN and deactivates again

# Poll confirmed manager parameters using the existing send_state transport.
script:
  - id: heating_write
    mode: single
    parameters:
      index: int
      requested: float
    then:
      - if:
          condition:
            lambda: |-
              const int slot = index == 5 ? 0 : index == 8 ? 1 : index == 0x010e ? 2 : index == 0x0112 ? 3 : -1;
              if (slot < 0 || !std::isfinite(requested)) return false;
              const float scale = slot == 3 ? 1.0f : slot == 2 ? 100.0f : 10.0f;
              const float low = slot >= 2 ? 0.0f : 10.0f;
              const float high = slot == 3 ? 5.0f : slot == 2 ? 3.0f : 30.0f;
              if (requested < low || requested > high ||
                  fabsf(requested * scale - roundf(requested * scale)) > 0.001f) {
                id(heating_write_status).publish_state("Rejected: range or step");
                return false;
              }
              if (!id(heating_last_read)[slot] || millis() - id(heating_last_read)[slot] > 90000) {
                id(heating_write_status).publish_state("Rejected: no recent controller reading");
                return false;
              }
              id(heating_write_index) = index;
              id(heating_write_raw) = slot == 3 ? (int(lroundf(requested)) << 8) : lroundf(requested * scale);
              return true;
          then:
            - script.stop: read_heating_curve_slope
            - lambda: |-
                id(heating_write_status).publish_state("Writing; awaiting read-back");
                const int raw = id(heating_write_raw);
                id(send_state)[0]=0x90; id(send_state)[1]=0;
                id(send_state)[2]=index < 256 ? index : 0xfa;
                id(send_state)[3]=index < 256 ? raw >> 8 : index >> 8;
                id(send_state)[4]=index < 256 ? raw & 255 : index & 255;
                id(send_state)[5]=index < 256 ? 0 : raw >> 8;
                id(send_state)[6]=index < 256 ? 0 : raw & 255;
                id(update_sensor).publish_state(true);
                id(update_sensor).publish_state(false);
            - delay: 750ms
            - lambda: |-
                id(heating_write_waiting) = true;
                id(send_state)[0]=0x91; id(send_state)[1]=0;
                id(send_state)[2]=index < 256 ? index : 0xfa;
                id(send_state)[3]=index < 256 ? 0 : index >> 8;
                id(send_state)[4]=index < 256 ? 0 : index & 255;
                id(send_state)[5]=0; id(send_state)[6]=0;
                id(update_sensor).publish_state(true);
                id(update_sensor).publish_state(false);
            - delay: 5s
            - lambda: |-
                if (id(heating_write_waiting)) {
                  id(heating_write_status).publish_state("Timeout: write unverified; check panel");
                  ESP_LOGW("heating_write", "Read-back timeout index=%04X", index);
                }
                id(heating_write_waiting) = false;
                id(heating_write_index) = -1;
  - id: read_heating_curve_slope
    mode: single
    then:
      - lambda: |-
          id(send_state)[0]=0x91; id(send_state)[1]=0;
          id(send_state)[2]=0x05; id(send_state)[3]=0; id(send_state)[4]=0;
          id(send_state)[5]=0; id(send_state)[6]=0;
          id(update_sensor).publish_state(true);
          id(update_sensor).publish_state(false);
      - delay: 500ms
      - lambda: |-
          id(send_state)[0]=0x91; id(send_state)[1]=0;
          id(send_state)[2]=0x08; id(send_state)[3]=0; id(send_state)[4]=0;
          id(send_state)[5]=0; id(send_state)[6]=0;
          id(update_sensor).publish_state(true);
          id(update_sensor).publish_state(false);
      - delay: 500ms
      - lambda: |-
          id(send_state)[0]=0x91; id(send_state)[1]=0;
          id(send_state)[2]=0xfa; id(send_state)[3]=0x01; id(send_state)[4]=0x0e;
          id(send_state)[5]=0; id(send_state)[6]=0;
          id(update_sensor).publish_state(true);
          id(update_sensor).publish_state(false);
      - delay: 500ms
      - lambda: |-
          id(send_state)[0]=0x91; id(send_state)[1]=0;
          id(send_state)[2]=0xfa; id(send_state)[3]=0x01; id(send_state)[4]=0x12;
          id(send_state)[5]=0; id(send_state)[6]=0;
          id(update_sensor).publish_state(true);
          id(update_sensor).publish_state(false);

interval:
  - interval: 30s
    startup_delay: 30s
    then:
      - if:
          condition:
            lambda: return !id(heating_write).is_running();
          then:
            - script.execute: read_heating_curve_slope

select:
  - platform: template
    name: "Heating operating mode setting"
    id: heating_mode_control
    icon: "mdi:radiator"
    optimistic: false
    options:
      - "Emergency"
      - "Standby"
      - "Automatic"
      - "Comfort"
      - "Eco"
      - "Hot water only"
    set_action:
      - lambda: |-
          // Explicit allow-list; no arbitrary enum or CAN value is accepted.
          int mode = -1;
          if (x == "Emergency") mode = 0;
          else if (x == "Standby") mode = 1;
          else if (x == "Automatic") mode = 2;
          else if (x == "Comfort") mode = 3;
          else if (x == "Eco") mode = 4;
          else if (x == "Hot water only") mode = 5;
          if (mode >= 0) id(heating_write).execute(0x0112, float(mode));

number:
  - platform: template
    name: "Heating comfort setpoint"
    id: heating_comfort_control
    unit_of_measurement: "°C"
    min_value: 10
    max_value: 30
    step: 0.1
    mode: box
    optimistic: false
    set_action:
      - script.execute:
          id: heating_write
          index: 5
          requested: !lambda return x;
  - platform: template
    name: "Heating eco setpoint"
    id: heating_eco_control
    unit_of_measurement: "°C"
    min_value: 10
    max_value: 30
    step: 0.1
    mode: box
    optimistic: false
    set_action:
      - script.execute:
          id: heating_write
          index: 8
          requested: !lambda return x;
  - platform: template
    name: "Heating curve slope setting"
    id: heating_slope_control
    min_value: 0
    max_value: 3
    step: 0.01
    mode: box
    optimistic: false
    set_action:
      - script.execute:
          id: heating_write
          index: 270
          requested: !lambda return x;

