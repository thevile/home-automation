esphome:
  name: esphome-web-1d2cb4
  friendly_name: Stiebel CAN
  min_version: 2025.11.0
  name_add_mac_suffix: false
#  board: esp32-c3-devkitm-1
#  variant: esp32c3

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:

# Service to pull individual can message from home assistant
  services:
    - service: pull_canmsg
      variables:
        idx: int
        addr: int
        val: int
      then:
        - lambda: |-
            int getA = static_cast<int>(addr); //Write address to byte 0 and 1
            id(sh_state)[0]=getA>>8;
            id(sh_state)[1]=getA-((getA>>8)<<8);

            getA = static_cast<int>(idx); //Take over Elster-Index
            //If Elster-Index <= 0xff => write to byte position 2
            if( (getA>>8) == 0x00) {
              id(sh_state)[2]=getA-((getA>>8)<<8);

              getA = static_cast<int>(val); //Take over data value and write to position 3 and 4, 5 and 6 is 0x00
              id(sh_state)[3]=getA>>8;
              id(sh_state)[4]=getA-((getA>>8)<<8);
              id(sh_state)[5]=0x00;
              id(sh_state)[6]=0x00;
            }
            else {
              //If Elster-Index > 0xff 0xfa comes to position 2, the index is then at position 3 and 4
              id(sh_state)[2]=0xfa;
              id(sh_state)[3]=getA>>8;
              id(sh_state)[4]=getA-((getA>>8)<<8);

              getA = static_cast<int>(val); //the data value is then at position 5 and 6
              id(sh_state)[5]=getA>>8;
              id(sh_state)[6]=getA-((getA>>8)<<8);
            }




