# Price-aware Eco heating.
#
# Eco is the optimized mode: during the day's most expensive 3-hour block the
# Eco setpoint is lowered, optionally preheated in the 2 hours before, and
# otherwise held at the configured baseline. Switching the heat pump to Comfort
# is the manual override; the Eco setpoint is then only restored to baseline.
#
# sensor.heating_eco_plan always shows what the optimizer would do (dry run);
# sensor.heating_eco_target is the plan while the optimizer is on, else baseline.
# The automation reconciles the controller towards sensor.heating_eco_target, so
# a missed write, HA restart or disabled optimizer converges back to baseline.
# Missing or incomplete prices also yield the baseline.

input_boolean:
  heating_price_optimizer:
    name: Heating price optimizer
    icon: mdi:radiator

input_number:
  heating_eco_baseline:
    name: Heating Eco baseline
    min: 16
    max: 22
    step: 0.1
    initial: 18.0
    unit_of_measurement: "°C"
    mode: box
  heating_price_reduction:
    name: Heating price reduction
    min: 0
    max: 2
    step: 0.1
    initial: 1.5
    unit_of_measurement: "°C"
    mode: box
  heating_price_preheat:
    name: Heating price preheat
    min: 0
    max: 1
    step: 0.1
    initial: 0.5
    unit_of_measurement: "°C"
    mode: box
  heating_price_min_premium:
    name: Heating price minimum premium
    min: 0
    max: 0.5
    step: 0.01
    initial: 0.05
    unit_of_measurement: "EUR/kWh"
    mode: box

template:
  - triggers:
      - trigger: time_pattern
        minutes: /5
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_boolean.heating_price_optimizer
          - input_number.heating_eco_baseline
          - input_number.heating_price_reduction
          - input_number.heating_price_preheat
          - input_number.heating_price_min_premium
    actions:
      - variables:
          block_slots: 12  # 3 h of 15-minute prices
          preheat_slots: 8  # 2 h before the block
          baseline: "{{ states('input_number.heating_eco_baseline') | float(18) }}"
          plan: >
            {% set raw = state_attr('sensor.nordpool_kwh_fi_eur_3_10_0255', 'raw_today') or [] %}
            {% set ns = namespace(slots=[], best=-1000, idx=-1) %}
            {% for p in raw if p.value is number %}
              {% set ns.slots = ns.slots + [{
                'start': p.start if p.start is not string else as_datetime(p.start),
                'end': p.end if p.end is not string else as_datetime(p.end),
                'value': p.value}] %}
            {% endfor %}
            {% set n = ns.slots | length %}
            {% if n < 92 or n != raw | length %}
              {{ {'ok': false, 'reason': 'Prices for today are missing or incomplete'} }}
            {% else %}
              {% set values = ns.slots | map(attribute='value') | list %}
              {% set median = (values | sort)[n // 2] %}
              {% for i in range(n - block_slots + 1) %}
                {% set m = (values[i:i + block_slots] | sum) / block_slots %}
                {% if m > ns.best %}{% set ns.best = m %}{% set ns.idx = i %}{% endif %}
              {% endfor %}
              {% set pre_from = [ns.idx - preheat_slots, 0] | max %}
              {% set pre = values[pre_from:ns.idx] %}
              {{ {'ok': true, 'median': median, 'block_mean': ns.best,
                  'block_start': ns.slots[ns.idx].start.isoformat(),
                  'block_end': ns.slots[ns.idx + block_slots - 1].end.isoformat(),
                  'preheat_start': ns.slots[pre_from].start.isoformat() if pre else none,
                  'preheat_mean': (pre | sum) / (pre | length) if pre else none} }}
            {% endif %}
      - variables:
          qualifies: >
            {{ plan.ok and plan.block_mean - plan.median
               >= states('input_number.heating_price_min_premium') | float(0.05) }}
          planned: >
            {% set t = now() %}
            {% if qualifies and as_datetime(plan.block_start) <= t < as_datetime(plan.block_end) %}
              {{ [baseline - states('input_number.heating_price_reduction') | float(0), 16] | max | round(1) }}
            {% elif qualifies and plan.preheat_start and plan.preheat_mean <= plan.median
                    and as_datetime(plan.preheat_start) <= t < as_datetime(plan.block_start) %}
              {{ (baseline + states('input_number.heating_price_preheat') | float(0)) | round(1) }}
            {% else %}
              {{ baseline | round(1) }}
            {% endif %}
          plan_reason: >
            {% if not plan.ok %}{{ plan.reason }}
            {% elif not qualifies %}Price spread too small today
            {% else %}Expensive block {{ as_datetime(plan.block_start).strftime('%H:%M') }}–{{ as_datetime(plan.block_end).strftime('%H:%M') }}{% endif %}
    sensor:
      # What the optimizer would do, regardless of the on/off switch (dry run).
      - name: Heating Eco plan
        unique_id: heating_eco_plan
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:thermometer-lines
        state: "{{ planned }}"
        attributes:
          baseline: "{{ baseline }}"
          block_start: "{{ plan.block_start if plan.ok else none }}"
          block_end: "{{ plan.block_end if plan.ok else none }}"
          preheat_start: "{{ plan.preheat_start if plan.ok and plan.preheat_mean is number and plan.preheat_mean <= plan.median else none }}"
          block_mean_price: "{{ plan.block_mean | round(4) if plan.ok else none }}"
          median_price: "{{ plan.median | round(4) if plan.ok else none }}"
          reason: "{{ plan_reason }}"
      # What the automation actually applies to the heat pump.
      - name: Heating Eco target
        unique_id: heating_eco_target
        unit_of_measurement: "°C"
        state_class: measurement
        icon: mdi:thermometer-auto
        state: >
          {{ planned if is_state('input_boolean.heating_price_optimizer', 'on') else baseline | round(1) }}
        attributes:
          reason: >
            {{ plan_reason if is_state('input_boolean.heating_price_optimizer', 'on') else 'Optimizer off' }}

automation:
  - id: heating_price_optimizer_apply
    alias: Heating price optimizer – apply Eco target
    description: >
      Keeps the WPF 10 Eco setpoint at sensor.heating_eco_target. Only acts in
      Eco mode, except that restoring the baseline is always allowed.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.heating_eco_target
      - trigger: state
        entity_id: select.stiebel_eltron_wpf_10_heating_operating_mode_setting
        to: Eco
      - trigger: time_pattern
        minutes: /15
    variables:
      target: "{{ states('sensor.heating_eco_target') | float(none) }}"
      baseline: "{{ states('input_number.heating_eco_baseline') | float(none) }}"
      eco: number.stiebel_eltron_wpf_10_heating_eco_setpoint
    conditions:
      - "{{ target is number and baseline is number and states(eco) | is_number }}"
      - "{{ (states(eco) | float - target) | abs >= 0.05 }}"
      - "{{ is_state('select.stiebel_eltron_wpf_10_heating_operating_mode_setting', 'Eco') or (target - baseline) | abs < 0.05 }}"
    actions:
      # The ESPHome writer ignores concurrent requests and never retries, so
      # verify the controller read-back and try once more before notifying.
      - repeat:
          count: 2
          sequence:
            - action: number.set_value
              target:
                entity_id: "{{ eco }}"
              data:
                value: "{{ target }}"
            - wait_template: "{{ (states(eco) | float(0) - target) | abs < 0.05 }}"
              timeout: "00:00:20"
            - if: "{{ (states(eco) | float(0) - target) | abs < 0.05 }}"
              then:
                - stop: Eco setpoint verified
            - delay: "00:00:10"
      - action: persistent_notification.create
        data:
          notification_id: heating_price_optimizer
          title: Heating price optimizer
          message: >
            Eco setpoint write to {{ target }} °C was not verified (controller
            reports {{ states(eco) }} °C). It will be retried within 15 minutes.
