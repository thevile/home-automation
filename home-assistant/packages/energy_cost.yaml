# Realized electricity price and the value of load timing.
#
# sensor.cumulative_active_import (P1 meter) and its Energy-dashboard cost
# sensor sensor.cumulative_active_import_cost already price every meter update
# at the current 15-minute spot price, so cost / kWh is the realized price.
#
# The Nord Pool sensor has state_class total, so long-term statistics keep only
# the last value per hour. sensor.electricity_price_all_in mirrors it as a
# measurement, so hourly statistics keep the exact 15-minute time average.
#
# The time-average price of a period is the price integrated over time divided
# by the hours the price was available, so restarts and outages do not skew it.
# Timing saving = (time-average price x kWh) - actual cost: what using power
# evenly over the day would have cost minus what it did cost. It is computed
# per day and summed, because over a month or year it would mostly measure
# that winter (heavy use) is expensive, not when in the day power is used.

template:
  - sensor:
      - name: Electricity price all-in
        unique_id: electricity_price_all_in
        unit_of_measurement: EUR/kWh
        state_class: measurement
        state: "{{ states('sensor.nordpool_kwh_fi_eur_3_10_0255') }}"
        availability: "{{ has_value('sensor.nordpool_kwh_fi_eur_3_10_0255') }}"
      - name: Electricity price available
        unique_id: electricity_price_available
        state: "{{ 1 if has_value('sensor.electricity_price_all_in') else 0 }}"

      - name: Electricity realized price this month
        unique_id: electricity_realized_price_month
        unit_of_measurement: c/kWh
        state_class: measurement
        state: >
          {{ (states('sensor.grid_cost_month') | float / states('sensor.grid_import_month') | float * 100) | round(2) }}
        availability: "{{ states('sensor.grid_import_month') | float(0) > 0 and has_value('sensor.grid_cost_month') }}"
      - name: Electricity average price this month
        unique_id: electricity_average_price_month
        unit_of_measurement: c/kWh
        state_class: measurement
        state: >
          {{ (states('sensor.electricity_price_hours_month') | float / states('sensor.electricity_price_available_hours_month') | float * 100) | round(2) }}
        availability: "{{ states('sensor.electricity_price_available_hours_month') | float(0) > 0 }}"
      - name: Electricity timing saving today
        unique_id: electricity_timing_saving_today
        unit_of_measurement: EUR
        state: >
          {% set average = states('sensor.electricity_price_hours_day') | float / states('sensor.electricity_price_available_hours_day') | float %}
          {{ (average * states('sensor.grid_import_day') | float - states('sensor.grid_cost_day') | float) | round(2) }}
        availability: >
          {{ states('sensor.electricity_price_available_hours_day') | float(0) > 0
             and has_value('sensor.grid_import_day') and has_value('sensor.grid_cost_day') }}
      - name: Electricity timing saving this month
        unique_id: electricity_timing_saving_month
        unit_of_measurement: EUR
        state: >
          {{ (states('sensor.electricity_timing_saving_month_closed') | float + states('sensor.electricity_timing_saving_today') | float(0)) | round(2) }}
        availability: "{{ has_value('sensor.electricity_timing_saving_month_closed') }}"

      - name: Electricity realized price this year
        unique_id: electricity_realized_price_year
        unit_of_measurement: c/kWh
        state_class: measurement
        state: >
          {{ (states('sensor.grid_cost_year') | float / states('sensor.grid_import_year') | float * 100) | round(2) }}
        availability: "{{ states('sensor.grid_import_year') | float(0) > 0 and has_value('sensor.grid_cost_year') }}"
      - name: Electricity average price this year
        unique_id: electricity_average_price_year
        unit_of_measurement: c/kWh
        state_class: measurement
        state: >
          {{ (states('sensor.electricity_price_hours_year') | float / states('sensor.electricity_price_available_hours_year') | float * 100) | round(2) }}
        availability: "{{ states('sensor.electricity_price_available_hours_year') | float(0) > 0 }}"
      - name: Electricity timing saving this year
        unique_id: electricity_timing_saving_year
        unit_of_measurement: EUR
        state: >
          {{ (states('sensor.electricity_timing_saving_year_closed') | float + states('sensor.electricity_timing_saving_today') | float(0)) | round(2) }}
        availability: "{{ has_value('sensor.electricity_timing_saving_year_closed') }}"

  # Running total of closed days, just before the daily meters reset at midnight.
  # The start trigger republishes the total (0 at first) so the meters have a baseline.
  - triggers:
      - trigger: time
        at: "23:59:50"
        id: close_day
      - trigger: homeassistant
        event: start
    sensor:
      - name: Electricity timing saving total
        unique_id: electricity_timing_saving_total
        unit_of_measurement: EUR
        state_class: total
        state: >
          {% set today = states('sensor.electricity_timing_saving_today') | float(0) if trigger.id == 'close_day' else 0 %}
          {{ (this.state | float(0) + today) | round(2) }}

sensor:
  # The price is a step function, so left-Riemann integration is exact.
  - platform: integration
    name: Electricity price hours
    unique_id: electricity_price_hours
    source: sensor.electricity_price_all_in
    method: left
    unit_time: h
    round: 6
  - platform: integration
    name: Electricity price available hours
    unique_id: electricity_price_available_hours
    source: sensor.electricity_price_available
    method: left
    unit_time: h
    round: 6

utility_meter:
  grid_import_day:
    source: sensor.cumulative_active_import
    cycle: daily
  grid_cost_day:
    source: sensor.cumulative_active_import_cost
    cycle: daily
    periodically_resetting: true
  electricity_price_hours_day:
    source: sensor.electricity_price_hours
    cycle: daily
  electricity_price_available_hours_day:
    source: sensor.electricity_price_available_hours
    cycle: daily
  electricity_timing_saving_month_closed:
    source: sensor.electricity_timing_saving_total
    cycle: monthly
    net_consumption: true
  electricity_timing_saving_year_closed:
    source: sensor.electricity_timing_saving_total
    cycle: yearly
    net_consumption: true
  grid_import_month:
    source: sensor.cumulative_active_import
    cycle: monthly
  grid_import_year:
    source: sensor.cumulative_active_import
    cycle: yearly
  # The Energy cost sensor resets itself (e.g. on HA restart).
  grid_cost_month:
    source: sensor.cumulative_active_import_cost
    cycle: monthly
    periodically_resetting: true
  grid_cost_year:
    source: sensor.cumulative_active_import_cost
    cycle: yearly
    periodically_resetting: true
  electricity_price_hours_month:
    source: sensor.electricity_price_hours
    cycle: monthly
  electricity_price_hours_year:
    source: sensor.electricity_price_hours
    cycle: yearly
  electricity_price_available_hours_month:
    source: sensor.electricity_price_available_hours
    cycle: monthly
  electricity_price_available_hours_year:
    source: sensor.electricity_price_available_hours
    cycle: yearly
